<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>DongDev Blog CMS</title>
  </head>
  <body>
    <!--
      Sveltia CMS — 폰/브라우저에서 글을 쓰고 develop 브랜치에 커밋한다.
      앱 번들과 무관한 정적 파일이라 package.json/의존성에 영향이 없다.
      주의(공식 문서 명시): CSS <link>를 넣지 말 것, type="module"을 붙이지 말 것 — 둘 다 오작동한다.
      1.0 이전이라 breaking change가 있을 수 있어 버전을 고정한다.
      버전을 올리면 integrity도 같이 갱신할 것(안 하면 스크립트가 차단돼 빈 화면이 된다):
        curl -sL <새 URL> | openssl dgst -sha384 -binary | openssl base64 -A
    -->
    <script
      src="https://unpkg.com/@sveltia/cms@0.213.4/dist/sveltia-cms.js"
      integrity="sha384-+8RqGMj37Dk0jEygUTA0V4kuL33YKjEWS4c84G8OqXQZY6ceSHa/EbKkIhL4zIcT"
      crossorigin="anonymous"
    ></script>
  </body>
