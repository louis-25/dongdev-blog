# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# 이 파일의 필드는 content-collections.ts의 Zod 스키마와 1:1로 맞춰야 한다.
# 어긋나면 커밋은 되지만 빌드가 실패한다(CMS는 빌드 게이트를 대신하지 못한다).

backend:
  name: github
  repo: louis-25/dongdev-blog
  # 생략하면 기본 브랜치(main)에 커밋되는데, vercel.json이 main 배포를 꺼놔서 아무 일도 일어나지 않는다.
  branch: develop
  # OAuth 인증 서버(sveltia-cms-auth, Cloudflare Workers). 이게 없으면 기본값이 Netlify라
  # "GitHub으로 로그인"이 Not Found로 끝난다. 워커의 ALLOWED_DOMAINS에 등록된 도메인에서만 동작한다.
  base_url: https://sveltia-cms-auth.2848048ehgu.workers.dev
  # OAuth를 기본으로 쓰되 토큰 로그인도 남긴다(워커에 문제가 생겨도 들어갈 수 있게).
  # 토큰은 반드시 classic + repo/read:org — fine-grained는 협업자 확인 API에서 403이 난다.
  auth_methods: [oauth, token]

# 파일명이 곧 URL(/blog/<파일명>)이다 — content-collections.ts의 slugAsParams
slug:
  encoding: unicode # 한글 제목 유지 (ascii면 한글이 통째로 -로 치환된다)
  lowercase: false # 기존 글 표기(PeerJS란, Context7 MCP)와 맞춤
  sanitize_replacement: "-" # 공백·슬래시를 -로 → %20 URL과 "GitLab CI/" 같은 폴더 사고 방지

media_folder: /public/posts/images # 이미지가 저장되는 위치
public_folder: /posts/images # 본문·thumbnail에 들어가는 경로 (썸네일 존재 검사와 동일 기준)

collections:
  - name: posts
    label: 글
    label_singular: 글
    folder: /posts
    path: "{{year}}-{{month}}/{{slug}}" # posts/2026-09/<제목>.mdx
    extension: mdx
    format: yaml-frontmatter
    create: true
    # 컬렉션에 절대 경로를 명시한다. 최상위 설정만 두면 업로드가 글 파일 옆
    # (posts/YYYY-MM/<슬러그>/)로 들어가 public/에 없으므로 빌드가 실패한다(실제로 발생).
    media_folder: /public/posts/images
    public_folder: /posts/images
    fields:
      - { name: title, label: 제목, widget: string, required: true }
      # type: date → YYYY-MM-DD로 저장된다 (스키마의 z.iso.date())
      - { name: date, label: 날짜, widget: datetime, type: date, required: true }
      - { name: description, label: 한 줄 요약, widget: string, required: true }
      - name: category
        label: 카테고리
        widget: select
        required: true
        options: [library, style, devops, framework, language, ai] # config/post.ts의 CATEGORY_LIST
      - name: tags
        label: 태그
        widget: select
        multiple: true
        required: false
        # 대소문자가 갈리면 빌드가 실패하므로(onSuccess 가드) 기존 표기를 목록으로 고정한다.
        # 새 태그를 쓰려면 이 목록에 먼저 추가할 것.
        options:
          [
            React,
            Javascript,
            typescript,
            nextjs,
            styled-components,
            Docker,
            GitLab,
            MCP,
          ]
      - { name: thumbnail, label: 썸네일, widget: image, required: false }
      - { name: published, label: 발행, widget: boolean, default: false }
      - name: body
        label: 본문
        widget: markdown
        # raw 전용: 리치텍스트 왕복에 기존 글의 <img>·<Alert> 같은 원시 마크업이 재작성되지 않게
        modes: [raw]

# 폰에서 올린 원본 사진이 그대로 저장소에 들어가지 않도록 업로드 시점에 변환한다.
# (실제로 6.1MB JPEG이 커밋된 적 있음 — webp 변환 + 장변 2048 제한이면 보통 수백 KB)
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2048
          height: 2048
