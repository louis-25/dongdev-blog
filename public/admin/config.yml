# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# 이 파일의 필드는 content-collections.ts의 Zod 스키마와 1:1로 맞춰야 한다.
# 어긋나면 커밋은 되지만 빌드가 실패한다(CMS는 빌드 게이트를 대신하지 못한다).

backend:
  name: github
  repo: louis-25/dongdev-blog
  # 생략하면 기본 브랜치(main)에 커밋되는데, vercel.json이 main 배포를 꺼놔서 아무 일도 일어나지 않는다.
  branch: develop
  # 토큰 로그인만 남긴다. OAuth 버튼은 인증 서버(기본값: Netlify)가 있어야 동작하는데
  # 우리는 서버를 두지 않았고, 그대로 누르면 Netlify가 Not Found를 돌려준다.
  auth_methods: [token]

# 파일명이 곧 URL(/blog/<파일명>)이다 — content-collections.ts의 slugAsParams
slug:
  encoding: unicode # 한글 제목 유지 (ascii면 한글이 통째로 -로 치환된다)
  lowercase: false # 기존 글 표기(PeerJS란, Context7 MCP)와 맞춤
  sanitize_replacement: "-" # 공백·슬래시를 -로 → %20 URL과 "GitLab CI/" 같은 폴더 사고 방지

media_folder: /public/posts/images # 이미지가 저장되는 위치
public_folder: /posts/images # 본문·thumbnail에 들어가는 경로 (썸네일 존재 검사와 동일 기준)

collections:
  - name: posts
    label: 글
    label_singular: 글
    folder: /posts
    path: "{{year}}-{{month}}/{{slug}}" # posts/2026-09/<제목>.mdx
    extension: mdx
    format: yaml-frontmatter
    create: true
    fields:
      - { name: title, label: 제목, widget: string, required: true }
      # type: date → YYYY-MM-DD로 저장된다 (스키마의 z.iso.date())
      - { name: date, label: 날짜, widget: datetime, type: date, required: true }
      - { name: description, label: 한 줄 요약, widget: string, required: true }
      - name: category
        label: 카테고리
        widget: select
        required: true
        options: [library, style, devops, framework, language, ai] # config/post.ts의 CATEGORY_LIST
      - name: tags
        label: 태그
        widget: select
        multiple: true
        required: false
        # 대소문자가 갈리면 빌드가 실패하므로(onSuccess 가드) 기존 표기를 목록으로 고정한다.
        # 새 태그를 쓰려면 이 목록에 먼저 추가할 것.
        options:
          [
            React,
            Javascript,
            typescript,
            nextjs,
            styled-components,
            Docker,
            GitLab,
            MCP,
          ]
      - { name: thumbnail, label: 썸네일, widget: image, required: false }
      - { name: published, label: 발행, widget: boolean, default: false }
      - name: body
        label: 본문
        widget: markdown
        # raw 전용: 리치텍스트 왕복에 기존 글의 <img>·<Alert> 같은 원시 마크업이 재작성되지 않게
        modes: [raw]
